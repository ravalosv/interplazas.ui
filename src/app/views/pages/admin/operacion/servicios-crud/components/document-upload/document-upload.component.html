<div class="mb-3">
  <label class="form-label" *ngIf="label">{{ label }}</label>
  
  <div class="d-flex align-items-center gap-2">
    <input
      type="file"
      #fileInput
      style="display:none"
      (change)="onFileChange($event)"
      accept=".pdf,image/*"
    />
    
    <button type="button" class="btn btn-outline-primary btn-sm" (click)="triggerUpload(fileInput)">
      <i class="feather icon-upload"></i> {{ hasFile ? 'Cambiar' : 'Cargar documento' }}
    </button>

    <button
      type="button"
      class="btn btn-info btn-sm"
      (click)="view.emit()"
      *ngIf="hasFile"
      title="Ver documento"
    >
      <i class="feather icon-eye"></i> Ver documento
    </button>

    <button
      type="button"
      class="btn btn-danger btn-sm"
      (click)="delete.emit()"
      *ngIf="hasFile"
      title="Eliminar documento"
    >
      <i class="feather icon-trash-2"></i>
    </button>
  </div>
</div>
