<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/admin/operacion">Operación</a>
    </li>
    <li class="breadcrumb-item active" aria-current="page">
      Cédulas
    </li>
  </ol>
</nav>

<nz-card>
  <div class="row mb-3">
    <div class="col-md-4">
      <label class="form-label">Periodo</label>
      <nz-select
        [(ngModel)]="selectedPeriodoId"
        (ngModelChange)="onPeriodoChange($event)"
        nzPlaceHolder="Seleccione un periodo"
        [nzLoading]="loading"
        nzAllowClear
        class="w-100"
      >
        <nz-option
          *ngFor="let p of periodos"
          [nzValue]="p.id"
          [nzLabel]="p.nombre"
        ></nz-option>
      </nz-select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Filtrar</label>
      <input
        nz-input
        placeholder="Buscar por filial..."
        [(ngModel)]="filterText"
        (ngModelChange)="applyFilter()"
      />
    </div>
    <div class="col-md-4 d-flex align-items-end justify-content-end">
      <button 
        nz-button 
        nzType="primary" 
        (click)="exportarTodo()" 
        [nzLoading]="exporting" 
        [disabled]="!selectedPeriodoId || cedulas.length === 0"
      >
        <i nz-icon nzType="download"></i> Exportar Cédulas
      </button>
    </div>
  </div>

  <nz-table
    #table
    [nzData]="displayCedulas"
    [nzLoading]="loadingCedulas"
  >
    <thead>
      <tr>
        <th>Filial</th>
        <th class="text-end">Total USA</th>
        <th class="text-end">Total Comisiones</th>
        <th class="text-end">Total Final</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of table.data">
        <td>{{ c.filial?.nombre || c.filialId }}</td>
        <td class="text-end">{{ c.totalUsa | currency:'USD':'symbol':'1.2-2' }}</td>
        <td class="text-end">{{ c.totalComisiones | currency:'USD':'symbol':'1.2-2' }}</td>
        <td class="text-end">{{ c.totalFinal | currency:'USD':'symbol':'1.2-2' }}</td>
        <td class="text-center">
          <button
            nz-button
            nzType="default"
            (click)="verDetalle(c)"
            [disabled]="!selectedPeriodoId"
          >
            Ver detalle
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>
