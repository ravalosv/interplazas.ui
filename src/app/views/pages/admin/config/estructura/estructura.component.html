<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/admin/config/usuarios">Organización</a>
    </li>
    <li class="breadcrumb-item active" aria-current="page">Listado</li>
  </ol>
</nav>

<nz-card>
  <nz-table
    #expandTable
    [nzData]="listOfMapData"
    nzTableLayout="fixed"
    class="table-style"
  >
    <thead>
      <tr>
        <th>Estructura</th>
        <th nzWidth="380px" nzAlign="right">
          <button
            nz-button
            nzType="primary"
            nzSize="small"
            nzShape="round"
            class="me-2"
            (click)="
              openEditorGrupo(modalEditorGrupo, modalTypeEnum.nuevoGrupo)
            "
          >
            Nuevo Grupo
          </button>
        </th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let data of expandTable.data">
        <ng-container *ngFor="let item of mapOfExpandedData[data.key]">
          <tr *ngIf="(item.parent && item.parent.expand) || !item.parent">
            <td
              [nzIndentSize]="item.level! * 20"
              [nzShowExpand]="!!item.children"
              [(nzExpand)]="item.expand"
              (nzExpandChange)="
                collapse(mapOfExpandedData[data.key], item, $event)
              "
            >
              {{ item.name }}
            </td>
            <td nzAlign="right">
              <button
                *ngIf="item.level == 0"
                nz-button
                nzType="primary"
                nzSize="small"
                nzShape="round"
                class="me-2"
                (click)="
                  openEditorGrupo(
                    modalEditorGrupo,
                    modalTypeEnum.nuevaUnidad,
                    null,
                    item
                  )
                "
              >
                Nueva Unidad de Negocio
              </button>
              <button
                *ngIf="item.level == 1"
                nz-button
                nzType="primary"
                nzSize="small"
                nzShape="round"
                class="me-2"
                (click)="
                  openEditorGrupo(
                    modalEditorGrupo,
                    modalTypeEnum.nuevaFilial,
                    null,
                    item
                  )
                "
              >
                Nueva Filial
              </button>

              <button
                nz-button
                nzType="default"
                nzSize="small"
                nzShape="round"
                class="me-2"
                (click)="
                  openEditorGrupo(
                    modalEditorGrupo,
                    item.level == 0
                      ? modalTypeEnum.editarGrupo
                      : item.level == 1
                      ? modalTypeEnum.editarUnidad
                      : modalTypeEnum.editarFilial,
                    item,
                    item.parent
                  )
                "
              >
                Editar
              </button>

              <button
                nz-button
                nzType="default"
                nzSize="small"
                nzShape="round"
                nzDanger="true"
                (click)="deleteEstructura(item)"
              >
                Eliminar
              </button>
            </td>
          </tr>
        </ng-container>
      </ng-container>
    </tbody>
  </nz-table>
</nz-card>

<ng-template #modalEditorGrupo let-modal>
  <form action="" [formGroup]="formGrupo">
    <div class="modal-header">
      <h5 class="modal-title">{{ modalTitle }}</h5>
      <button
        type="button"
        class="btn-close"
        (click)="modal.close('by: close icon')"
        aria-label="Close"
      ></button>
    </div>
    <div class="modal-body">
      <div class="row ms-1 me-1 mb-2" *ngIf="nombreGrupoVisible()">
        <label class="form-label"><strong>Grupo</strong></label>
        <input
          type="text"
          class="form-control"
          formControlName="nombreGrupo"
          readonly="true"
        />
      </div>
      <div class="row ms-1 me-1 mb-2" *ngIf="nombreUNVisible()">
        <label class="form-label"><strong>Unidad de Negocio</strong></label>
        <input
          type="text"
          class="form-control"
          formControlName="nombreUN"
          readonly="true"
        />
      </div>

      <div class="row ms-1 me-1 mb-2">
        <label class="form-label"
          ><strong>{{ fieldTitle }}</strong></label
        >
        <input
          type="text"
          class="form-control"
          placeholder="{{ fieldTitle }}"
          formControlName="nombre"
        />
        <div
          class="alert alert-danger p-2"
          *ngIf="
            formGrupo.get('nombre')?.touched &&
            formGrupo.get('nombre')?.errors?.required
          "
        >
          El nombre del grupo es requerido
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-primary"
        [disabled]="formGrupo.invalid"
        (click)="guardarEstructura(true)"
      >
        Guardar y cerrar
      </button>
      <button
        type="button"
        class="btn btn-success"
        [disabled]="formGrupo.invalid"
        (click)="guardarEstructura(false)"
      >
        Guardar y nuevo
      </button>
    </div>
  </form>
</ng-template>
