<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/admin/config/sucursales-admin">Sucursales</a>
    </li>
    <li class="breadcrumb-item active" aria-current="page">Listado</li>
  </ol>
  <div class="d-flex justify-content-between align-items-center bd-highlight mb-3">
    <div class="flex-grow-1 bd-highlight me-2">
      <input
        type="text"
        class="form-control w-100"
        placeholder="Filtrar por nombre o filial"
        [(ngModel)]="filtro"
      />
    </div>
    <div class="bd-highlight ms-2">
      <button class="btn btn-primary" (click)="openCreate(modalSucursalEditor)">
        <i class="feather icon-file-plus pe-2"></i>
        Nueva Sucursal
      </button>
    </div>
  </div>
  <ng-template #modalSucursalEditor let-modal>
    <form [formGroup]="form">
      <div class="modal-header">
        <h5 class="modal-title">{{ modalTitle }}</h5>
        <button
          type="button"
          class="btn-close"
          (click)="modal.close('by: close icon')"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Grupo</strong></label>
          <ng-select
            [items]="grupos"
            bindLabel="nombre"
            bindValue="id"
            formControlName="grupoId"
            placeholder="Seleccione un grupo"
            (change)="onGrupoChange()"
          >
          </ng-select>
          <div
            class="alert alert-danger p-2"
            *ngIf="form.get('grupoId')?.touched && form.get('grupoId')?.errors?.required"
          >
            El grupo es requerido
          </div>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Filial</strong></label>
          <ng-select
            [items]="filialesFiltradas"
            bindLabel="nombre"
            bindValue="id"
            formControlName="filialId"
            placeholder="Seleccione una filial"
          >
          </ng-select>
          <div
            class="alert alert-danger p-2"
            *ngIf="form.get('filialId')?.touched && form.get('filialId')?.errors?.required"
          >
            La filial es requerida
          </div>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Nombre</strong></label>
          <input
            type="text"
            class="form-control"
            formControlName="nombre"
            placeholder="Nombre de la sucursal"
          />
          <div
            class="alert alert-danger p-2"
            *ngIf="form.get('nombre')?.touched && form.get('nombre')?.errors?.required"
          >
            El nombre es requerido
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="form.invalid"
          (click)="save(true)"
        >
          Guardar y cerrar
        </button>
        <button
          type="button"
          class="btn btn-success"
          [disabled]="form.invalid"
          (click)="save(false)"
        >
          Guardar y nuevo
        </button>
      </div>
    </form>
  </ng-template>
</nav>

<nz-card>
  <nz-table
    #sucursalesTable
    [nzData]="sucursalesFiltradas"
    [nzLoading]="loading"
    [nzFrontPagination]="true"
    [nzPageSize]="10"
  >
    <thead>
      <tr>
        <th>Grupo</th>
        <th>Filial</th>
        <th>Nombre sucursal</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of sucursalesTable.data">
        <td>{{ item.filial?.grupo?.nombre }}</td>
        <td>{{ item.filial?.nombre }}</td>
        <td>{{ item.nombre }}</td>
        <td class="text-end">
          <button
            nz-button
            nzType="default"
            class="me-2"
            (click)="openEdit(modalSucursalEditor, item)"
          >
            Editar
          </button>
          <button
            nz-button
            nzType="default"
            nzDanger
            (click)="onDelete(item)"
          >
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>
