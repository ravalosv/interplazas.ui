<div class="row w-100 mx-0 auth-page">
  <div class="col-md-8 col-xl-6 mx-auto">
    <div class="card">
      <div class="row">
        <div class="col-md-4 pe-md-0">
          <div
            class="auth-side-wrapper"
            [ngStyle]="{
              'background-image': 'url(assets/images/portada.jpg)'
            }"
          ></div>
        </div>
        <div class="col-md-8 ps-md-0">
          <div class="auth-form-wrapper px-4 py-5">
            <a routerLink="." class="nobleui-logo d-block mb-2"
              >Servicios<span>CCI</span></a
            >
            <h5 class="text-muted fw-normal mb-4">
              Bienvenido! Ingresa tus credenciales para continuar.
            </h5>
            <form class="forms-sample" [formGroup]="loginForm">
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="exampleInputEmail1"
                  placeholder="Email"
                  value="admin@demo.com"
                  formControlName="email"
                />
                <div *ngIf="loginForm.get('email')?.invalid && (loginForm.get('email')?.dirty || loginForm.get('email')?.touched)" class="text-danger mt-1">
                  <div *ngIf="loginForm.get('email')?.errors?.['required']">El email es requerido</div>
                  <div *ngIf="loginForm.get('email')?.errors?.['email']">El formato del email no es válido</div>
                </div>
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label"
                  >Password</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="exampleInputPassword1"
                  autocomplete="current-password"
                  placeholder="Password"
                  value="12345678"
                  formControlName="password"
                />
                <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="text-danger mt-1">
                  <div *ngIf="loginForm.get('password')?.errors?.['required']">El password es requerido</div>
                </div>
              </div>
              <!--               <div class="form-check mb-3">
                <input
                  type="checkbox"
                  class="form-check-input"
                  id="authCheck"
                />
                <label class="form-check-label" for="authCheck">
                  Remember me
                </label>
              </div> -->
              <div>
                <button
                  type="submit"
                  class="btn btn-primary me-2 mb-2 mb-md-0"
                  (click)="onLoggedin($event)"
                  [appLoading]="isLoading"
                >
                  Login
                </button>
                <!--                 <button
                  type="button"
                  class="btn btn-outline-primary btn-icon-text mb-2 mb-md-0"
                >
                  <i class="feather icon-twitter btn-icon-prepend"></i>
                  Login with twitter
                </button> -->
              </div>
              <!--               <a routerLink="/auth/register" class="d-block mt-3 text-muted"
                >Not a user? Sign up</a
              > -->
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
