<div
  [ngClass]="{
    'alert  d-flex justify-content-between align-items-center': true,
    'alert-success': invitadosActuales <= invitadosMaximos,
    'alert-danger': invitadosActuales > invitadosMaximos
  }"
  role="alert"
>
  <span class="flex-grow-1"
    >Invitados: {{ invitadosActuales }} de {{ invitadosMaximos }}</span
  >
  <button
    class="btn btn-success btn-sm me-2"
    (click)="openResumenMesas(resumenMesasTemplate)"
  >
    Resumen Mesas
  </button>
</div>

<div class="row">
  <div class="d-flex flex-row bd-highlight mb-3">
    <div class="p-2 bd-highlight">
      <label class="form-label"><strong>Grupo</strong></label>
      <ng-select
        style="width: 250px"
        [items]="filtroGrupos"
        bindValue="id"
        bindLabel="nombre"
        [searchable]="false"
        [clearable]="false"
        [(ngModel)]="selectedFiltroGrupo"
        [ngModelOptions]="{ standalone: true }"
        (change)="onFiltroGrupoChange($event)"
        #lstGrupos
      >
      </ng-select>
    </div>

    <div class="p-2 bd-highlight">
      <div class="row">
        <label class="form-label"><strong>Filtro invitados</strong></label>
      </div>

      <div class="row">
        <nz-tree-select
          style="width: 350px"
          class="tree-style"
          [(ngModel)]="invitadoTreeSelectedValue"
          [nzNodes]="nodesInvitados"
          (ngModelChange)="onInvitadosFilterChanged($event)"
          nzShowSearch
          nzCheckable
          nzAllowClear
          #treeInvitados
        ></nz-tree-select>
      </div>
    </div>

    <div class="p-2 bd-highlight">
      <div class="row">
        <label class="form-label"><strong>Filtro Mesas</strong></label>
      </div>

      <div class="row">
        <nz-tree-select
          style="width: 450px"
          class="tree-style"
          [(ngModel)]="mesaTreeSelectedValue"
          [nzNodes]="nodesMesas"
          (ngModelChange)="onMesasFilterChanged($event)"
          nzShowSearch
          nzCheckable
          nzAllowClear
          #treeMesas
        ></nz-tree-select>
      </div>
    </div>
  </div>
</div>

<nz-spin [nzSpinning]="isLoading" [nzSize]="'large'">
  <div cdkDropListGroup>
    <div class="row">
      <div class="col-2">
        <div class="row">
          <div class="d-flex flex-row bd-highlight">
            <div class="p-2 bd-highlight flex-grow-1">
              <strong>Invitados</strong>
            </div>
            <div class="p-2 bd-highlight">
              <span
                *ngIf="readOnlyMode == false"
                class="badge rounded-pill bg-primary"
                (click)="openBasicModal(basicModal, null)"
                style="cursor: pointer"
                >Agregar</span
              >
            </div>
          </div>
        </div>
        <div style="height: 500px; overflow-y: auto">
          <app-evento-invitados-mesa
            [eventoId]="eventoId!"
            (droppedItemEvent)="droppedItem($event)"
            (editEvent)="openBasicModal(basicModal, $event)"
            [readOnlyMode]="readOnlyMode"
          >
          </app-evento-invitados-mesa>
        </div>
      </div>
      <div class="col-10">
        <div class="row">
          <div class="d-flex flex-row bd-highlight">
            <div class="p-2 bd-highlight flex-grow-1">
              <strong>Mesas</strong>
            </div>
            <div class="p-2 bd-highlight">
              <span
                *ngIf="distribucionMesaUrl"
                class="badge rounded-pill bg-primary"
                (click)="openImageWindow()"
                style="cursor: pointer"
                >Ver Mapa de mesas</span
              >
            </div>
          </div>
        </div>
        <div style="height: 500px; overflow-y: auto; overflow-x: hidden">
          <app-evento-mesa
            *ngFor="let m of listaMesasFiltrada"
            [mesa]="m"
            (droppedItemEvent)="droppedItem($event)"
            (editEvent)="openBasicModal(basicModal, $event)"
            [readOnlyMode]="readOnlyMode"
          ></app-evento-mesa>
        </div>
      </div>
    </div>
  </div>
</nz-spin>

<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">{{ getModalTitle() }}</h5>
    <button
      type="button"
      class="btn-close"
      (click)="modal.close('by: close icon')"
      aria-label="Close"
    ></button>
  </div>
  <div class="modal-body">
    <app-event-invitado-edit
      [grupoFilial]="filtroGrupos"
      [eventoId]="eventoId!"
      [invitadoId]="invitadoEditar"
      (onInvitadoDeleted)="onInvitadoDeleted($event)"
      (onInvitadoSaved)="onInvitadoSaved($event)"
      [readOnlyMode]="readOnlyMode"
    ></app-event-invitado-edit>
  </div>
</ng-template>

<ng-template #resumenMesasTemplate let-modal>
  <nz-spin [nzSpinning]="false" [nzSize]="'large'">
    <div class="modal-header">
      <h5 class="modal-title">Resumen de Mesas</h5>
      <button
        type="button"
        class="btn-close"
        (click)="modal.close('by: close icon')"
        aria-label="Close"
      ></button>
    </div>
    <div class="modal-body">
      <nz-table
        #editRowTableResumen
        nzBordered
        [nzData]="resumenMesas"
        nzTableLayout="fixed"
      >
        <thead>
          <tr>
            <th nzWidth="15%">Grupo</th>
            <th nzWidth="30%">Tipo Mesa</th>
            <th nzWidth="12%" style="text-align: center">Mesas Totales</th>
            <th nzWidth="12%" style="text-align: center">Mesas sin utilizar</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of editRowTableResumen.data">
            <ng-container>
              <td>{{ data.nombreGrupo }}</td>
              <td>{{ data.tipoMesa }}</td>
              <td>{{ data.totalMesas }}</td>
              <td>{{ data.totalMesasDisponibles }}</td>
            </ng-container>
          </tr>
        </tbody>
      </nz-table>
    </div>
    <div class="modal-footer">
      <button
        type="button"
        class="btn btn-primary"
        (click)="downloadReporteMesas()"
      >
        Descargar CSV
      </button>
    </div>
  </nz-spin>
</ng-template>
