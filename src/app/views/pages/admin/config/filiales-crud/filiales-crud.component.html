<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/admin/config/filiales-admin">Filiales</a>
    </li>
    <li class="breadcrumb-item active" aria-current="page">Listado</li>
  </ol>
  <div class="d-flex justify-content-between align-items-center bd-highlight mb-3">
    <div class="flex-grow-1 bd-highlight me-2">
      <input
        type="text"
        class="form-control w-100"
        placeholder="Filtrar por nombre o grupo"
        [(ngModel)]="filtro"
      />
    </div>
    <div class="bd-highlight ms-2">
      <button class="btn btn-primary" (click)="openCreate(modalFilialEditor)">
        <i class="feather icon-file-plus pe-2"></i>
        Nueva Filial
      </button>
    </div>
  </div>
  <ng-template #modalFilialEditor let-modal>
    <form [formGroup]="form">
      <div class="modal-header">
        <h5 class="modal-title">{{ modalTitle }}</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Nombre</strong></label>
          <input type="text" class="form-control" formControlName="nombre" placeholder="Nombre de la filial" />
          <div class="alert alert-danger p-2" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.errors?.required">
            El nombre es requerido
          </div>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Grupo</strong></label>
          <ng-select [items]="grupos" bindLabel="nombre" bindValue="id" formControlName="grupoId" placeholder="Seleccione un grupo">
          </ng-select>
          <div class="alert alert-danger p-2" *ngIf="form.get('grupoId')?.touched && form.get('grupoId')?.errors?.required">
            El grupo es requerido
          </div>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Extranjera</strong></label>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="extranjeraSwitch" formControlName="extranjera" />
            <label class="form-check-label" for="extranjeraSwitch">Extranjera</label>
          </div>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Utiliza API</strong></label>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="utilizaApiSwitch" formControlName="utilizaApi" />
            <label class="form-check-label" for="utilizaApiSwitch">Utiliza API</label>
          </div>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>API URL</strong></label>
          <input type="text" class="form-control" formControlName="apiUrl" placeholder="URL de la API" />
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>API KEY</strong></label>
          <input type="text" class="form-control" formControlName="apiKey" placeholder="Key de la API" />
        </div>
        <hr />
        <h5 class="ms-1 mb-3">Templates de Mensajes (Saldo PABS)</h5>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Saldo = 0</strong></label>
          <ng-select [items]="emailTemplates" bindLabel="nombre" bindValue="id" formControlName="templateSaldoPabsCero" placeholder="Seleccione un template">
          </ng-select>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Saldo > 1 (Con Convenio)</strong></label>
          <ng-select [items]="emailTemplates" bindLabel="nombre" bindValue="id" formControlName="templateSaldoPabsConConvenio" placeholder="Seleccione un template">
          </ng-select>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Saldo > 1 (Sin Convenio)</strong></label>
          <ng-select [items]="emailTemplates" bindLabel="nombre" bindValue="id" formControlName="templateSaldoPabsSinConvenio" placeholder="Seleccione un template">
          </ng-select>
        </div>
        <div class="row ms-1 me-1 mb-2">
          <label class="form-label"><strong>Saldo Parcial (Con Convenio Cobrado Parcialmente)</strong></label>
          <ng-select [items]="emailTemplates" bindLabel="nombre" bindValue="id" formControlName="templateSaldoPabsParcial" placeholder="Seleccione un template">
          </ng-select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" [disabled]="form.invalid" (click)="save(true)">Guardar y cerrar</button>
        <button type="button" class="btn btn-success" [disabled]="form.invalid" (click)="save(false)">Guardar y nuevo</button>
      </div>
    </form>
  </ng-template>
</nav>

<nz-card>
  <nz-table #filialesTable [nzData]="filialesFiltradas" [nzLoading]="loading" [nzFrontPagination]="true" [nzPageSize]="10">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Grupo</th>
        <th>Extranjera</th>
        <th>Utiliza API</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of filialesTable.data">
        <td>{{ item.nombre }}</td>
        <td>{{ item.grupo?.nombre }}</td>
        <td>{{ item.extranjera ? 'Sí' : 'No' }}</td>
        <td>{{ item.utilizaApi ? 'Sí' : 'No' }}</td>
        <td class="text-end">
          <button nz-button nzType="default" class="me-2" (click)="openEdit(modalFilialEditor, item)">
            Editar
          </button>
          <button nz-button nzType="default" nzDanger (click)="onDelete(item)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>
