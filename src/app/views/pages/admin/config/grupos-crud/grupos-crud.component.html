<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/admin/config/grupos-admin">Grupos</a>
    </li>
    <li class="breadcrumb-item active" aria-current="page">Listado</li>
  </ol>
  <div class="d-flex justify-content-end bd-highlight mb-3">
    <div class="bd-highlight me-2">
      <button class="btn btn-primary" (click)="openCreate(modalGrupoEditor)">
        <i class="feather icon-file-plus pe-2"></i>
        Nuevo Grupo
      </button>
    </div>
  </div>
  <ng-template #modalGrupoEditor let-modal>
    <form [formGroup]="form">
      <div class="modal-header">
        <h5 class="modal-title">{{ modalTitle }}</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-tabs">
          <li [ngbNavItem]="1">
            <a ngbNavLink>Datos Grupo</a>
            <ng-template ngbNavContent>
              <div class="mt-3">
                <div class="row ms-1 me-1 mb-2">
                  <label class="form-label"><strong>Nombre</strong></label>
                  <input type="text" class="form-control" formControlName="nombre" placeholder="Nombre del grupo" />
                  <div class="alert alert-danger p-2" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.errors?.required">
                    El nombre es requerido
                  </div>
                </div>
                <div class="row ms-1 me-1 mb-2">
                  <label class="form-label"><strong>Cobro entre filiales</strong></label>
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="cobroSwitch" formControlName="cobroEntreFiliales" />
                    <label class="form-check-label" for="cobroSwitch">Habilitado</label>
                  </div>
                </div>
              </div>
            </ng-template>
          </li>
          <li [ngbNavItem]="2">
            <a ngbNavLink>Cédula</a>
            <ng-template ngbNavContent>
              <div class="mt-3">
                <div class="row ms-1 me-1 mb-2">
                  <label class="form-label"><strong>Template Cédula</strong></label>
                  <ng-select [items]="emailTemplates" bindLabel="nombre" bindValue="id" formControlName="cedula_template_id" placeholder="Seleccione un template">
                  </ng-select>
                </div>
                <div class="row ms-1 me-1 mb-2">
                  <label class="form-label"><strong>Destinatarios Email Cédula</strong></label>
                  <textarea class="form-control" formControlName="cedula_destinatarios_email" placeholder="Correos separados por coma" rows="3"></textarea>
                </div>
              </div>
            </ng-template>
          </li>
        </ul>
        <div [ngbNavOutlet]="nav"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" [disabled]="form.invalid" (click)="save(true)">Guardar y cerrar</button>
        <button type="button" class="btn btn-success" [disabled]="form.invalid" (click)="save(false)">Guardar y nuevo</button>
      </div>
    </form>
  </ng-template>
</nav>

<nz-card>
  <nz-table #gruposTable [nzData]="grupos" [nzLoading]="loading" [nzFrontPagination]="true" [nzPageSize]="10">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Cobro entre filiales</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of gruposTable.data">
        <td>{{ item.nombre }}</td>
        <td>{{ item.cobroEntreFiliales ? 'Sí' : 'No' }}</td>
        <td class="text-end">
          <button nz-button nzType="default" class="me-2" (click)="openEdit(modalGrupoEditor, item)">
            Editar
          </button>
          <button nz-button nzType="default" nzDanger (click)="onDelete(item)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>
