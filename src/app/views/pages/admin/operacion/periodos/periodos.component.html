<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a routerLink="/admin/operacion">Operación</a></li>
    <li class="breadcrumb-item active" aria-current="page">Periodos</li>
  </ol>
</nav>

<nz-card>
  <nz-table #table [nzData]="displayPeriodos" [nzLoading]="loading">
    <thead>
      <tr>
        <th [nzSortFn]="sortId">ID</th>
        <th [nzSortFn]="sortNombre">Nombre</th>
        <th [nzSortFn]="sortMes">Mes</th>
        <th [nzSortFn]="sortAnio">Año</th>
        <th [nzSortFn]="sortEstado">Estado</th>
        <th>Fechas</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of table.data">
        <td>{{ p.id }}</td>
        <td>{{ p.nombre }}</td>
        <td>{{ p.mes }}</td>
        <td>{{ p.anio }}</td>
        <td>
          <span class="badge me-1" [ngClass]="p.activo ? 'bg-success' : 'bg-danger'">
            {{ p.activo ? 'Abierto' : 'Cerrado' }}
          </span>
          <span *ngIf="p.cedulas && p.cedulas.length > 0" class="badge bg-primary me-1">
            Cédulas
          </span>
          <span *ngIf="p.estadoCuentaGenerado" class="badge bg-info">
            Estado de Cuenta
          </span>
        </td>
        <td>
          <button nz-button nzType="default" nzSize="small" (click)="openEditModal(p)">
            <i class="feather icon-edit me-2"></i> Editar
          </button>
        </td>
        <td>
          <button *ngIf="p.activo" nz-button nzType="default" class="me-2" (click)="cerrarPeriodo(p)" title="Cerrar Periodo" [appLoading]="processingId === p.id && processingAction === 'close'">
            <i class="feather icon-lock me-2"></i> Cerrar
          </button>
          <button *ngIf="!p.activo" nz-button nzType="primary" (click)="abrirPeriodo(p)" title="Abrir Periodo" [appLoading]="processingId === p.id && processingAction === 'open'">
            <i class="feather icon-unlock me-2"></i> Abrir
          </button>
          
          <button nz-button nzType="default" class="ms-2" (click)="generarCedulas(p)" [disabled]="p.cedulas && p.cedulas.length > 0" title="Generar Cédulas" [appLoading]="processingId === p.id && processingAction === 'cedulas'">
            <i class="feather icon-file-text me-2"></i> {{ (p.cedulas && p.cedulas.length > 0) ? 'Cédulas generadas' : 'Generar cédulas' }}
          </button>

          <button 
            *ngIf="!p.activo" 
            nz-button 
            nzType="default" 
            class="ms-2" 
            (click)="generarEstadoCuenta(p)" 
            title="Generar Estado de Cuenta"
            [disabled]="p.estadoCuentaGenerado || !p.cedulas || p.cedulas.length === 0"
            [appLoading]="processingId === p.id && processingAction === 'ec'"
          >
            <i class="feather icon-audit me-2"></i> {{ p.estadoCuentaGenerado ? 'EC Generado' : 'Generar EC' }}
          </button>
        </td>
      </tr>
    </tbody>
  </nz-table>
</nz-card>

<nz-modal
  [(nzVisible)]="isVisibleModal"
  nzTitle="Editar Fechas del Periodo"
  (nzOnCancel)="handleCancel()"
  nzWidth="800px"
>
  <ng-container *nzModalContent>
    <form nz-form *ngIf="editingPeriodo">
      <div class="row">
        <div class="col-md-6">
          <nz-form-item>
            <nz-form-label [nzSm]="10" [nzXs]="24">Fecha Revisión</nz-form-label>
            <nz-form-control [nzSm]="14" [nzXs]="24">
              <input nz-input [(ngModel)]="editingPeriodo.fecha_revision" name="fecha_revision" placeholder="Ej. 2026-02-13" />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div class="col-md-6">
          <nz-form-item>
            <nz-form-label [nzSm]="10" [nzXs]="24">Fecha Reenvío Cédulas</nz-form-label>
            <nz-form-control [nzSm]="14" [nzXs]="24">
              <input nz-input [(ngModel)]="editingPeriodo.fecha_reenvio_cedulas" name="fecha_reenvio_cedulas" placeholder="Ej. 2026-02-13" />
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <nz-form-item>
            <nz-form-label [nzSm]="10" [nzXs]="24">Fecha Visto Bueno</nz-form-label>
            <nz-form-control [nzSm]="14" [nzXs]="24">
              <input nz-input [(ngModel)]="editingPeriodo.fecha_visto_bueno" name="fecha_visto_bueno" placeholder="Ej. 2026-02-13" />
            </nz-form-control>
          </nz-form-item>
        </div>
        <div class="col-md-6">
          <nz-form-item>
            <nz-form-label [nzSm]="10" [nzXs]="24">Fecha Cierre Periodo</nz-form-label>
            <nz-form-control [nzSm]="14" [nzXs]="24">
              <input nz-input [(ngModel)]="editingPeriodo.fecha_cierre_periodo" name="fecha_cierre_periodo" placeholder="Ej. 2026-02-13" />
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </form>
  </ng-container>
  <div *nzModalFooter>
    <button nz-button nzType="default" (click)="handleCancel()">Cancelar</button>
    <button nz-button nzType="primary" (click)="handleOk()" [appLoading]="isConfirmLoading">Aceptar</button>
  </div>
</nz-modal>
